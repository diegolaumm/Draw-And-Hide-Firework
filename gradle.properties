# Gradle JVM 記憶體設定（建議至少 2G，避免 Loom 解包時 OutOfMemory）
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 啟用 Loom 未混淆架構開關（解決 mappings has no dependencies 錯誤）
fabric.loom.disableObfuscation=true

# Mod 基礎屬性
mod_version=1.0.0
maven_group=com.drawfirework
archives_base_name=drawfirework

# 工具鏈與 Loader 版本
loom_version=1.17.16
loader_version=0.19.5

# 依賴版本
minecraft_version=26.3
fabric_version=0.163.0+26.3

# Java 目標版本
java_version=25
